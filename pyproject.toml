[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linalg"
version = "0.1.0"
description = "Linear algebra from scratch"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["linalg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
